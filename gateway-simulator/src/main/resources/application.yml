server:
  port: ${PORT:8081}

spring:
  application:
    name: gateway-simulator-${simulator.gateway}
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

simulator:
  gateway: ${SIM_GATEWAY:A}
  webhook-secret: ${SIM_WEBHOOK_SECRET:whsec_dev_only_change_me}
  api-key: ${SIM_API_KEY:}
  default-target-url: ${SIM_TARGET_URL:http://localhost:${server.port}/dev/sink}
  default-time-scale: ${SIM_TIME_SCALE:1.0}
  webhook-timeout-ms: 5000
  retry:
    max-attempts: 4
    initial-backoff-ms: 2000
    multiplier: 2.0
  dev-sink:
    enabled: true
    capacity: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
