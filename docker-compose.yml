# Whole system locally, no AWS:
#   3 fake gateways -> Concord (ingestion + engine + resolver + delivery, in memory) -> sample merchant (PostgreSQL)
#
#   docker compose up --build
#   then follow "Try it" in README.md (create orders, run a scenario, compare truth, Concord and merchant)
x-simulator: &simulator
  build:
    context: .
    dockerfile: gateway-simulator/Dockerfile
  image: concord/gateway-simulator:dev
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: merchant
      POSTGRES_PASSWORD: merchant
      POSTGRES_DB: merchant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchant"]
      interval: 2s
      retries: 30

  merchant:
    build:
      context: .
      dockerfile: sample-merchant/Dockerfile
    image: concord/sample-merchant:dev
    ports: ["8090:8090"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8090
      MERCHANT_DB_URL: jdbc:postgresql://postgres:5432/merchant
      MERCHANT_DB_USER: merchant
      MERCHANT_DB_PASSWORD: merchant
      CONCORD_DELIVERY_SECRET: whsec_concord_dev
      CONCORD_REGISTER_URL: http://concord:8080/payments/register

  concord:
    build:
      context: .
      dockerfile: local-runner/Dockerfile
    image: concord/local-runner:dev
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      GATEWAY_A_SECRETS: whsec_dev_gateway_a
      GATEWAY_B_SECRETS: whsec_dev_gateway_b
      GATEWAY_C_SECRETS: whsec_dev_gateway_c
      GATEWAY_A_STATUS_URL: http://gateway-a:8081
      GATEWAY_A_API_KEY: key_dev_gateway_a
      GATEWAY_B_STATUS_URL: http://gateway-b:8082
      GATEWAY_B_API_KEY: key_dev_gateway_b
      GATEWAY_C_STATUS_URL: http://gateway-c:8083
      GATEWAY_C_API_KEY: key_dev_gateway_c
      MERCHANT_URL: http://merchant:8090
      CONCORD_DELIVERY_SECRET: whsec_concord_dev
      RESOLVER_PROFILE: demo

  gateway-a:
    <<: *simulator
    ports: ["8081:8081"]
    environment:
      PORT: 8081
      SIM_GATEWAY: A
      SIM_WEBHOOK_SECRET: whsec_dev_gateway_a
      SIM_API_KEY: key_dev_gateway_a
      SIM_TARGET_URL: http://concord:8080/webhooks/a

  gateway-b:
    <<: *simulator
    ports: ["8082:8082"]
    environment:
      PORT: 8082
      SIM_GATEWAY: B
      SIM_WEBHOOK_SECRET: whsec_dev_gateway_b
      SIM_API_KEY: key_dev_gateway_b
      SIM_TARGET_URL: http://concord:8080/webhooks/b

  gateway-c:
    <<: *simulator
    ports: ["8083:8083"]
    environment:
      PORT: 8083
      SIM_GATEWAY: C
      SIM_WEBHOOK_SECRET: whsec_dev_gateway_c
      SIM_API_KEY: key_dev_gateway_c
      SIM_TARGET_URL: http://concord:8080/webhooks/c
