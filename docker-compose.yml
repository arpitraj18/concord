# Local pipeline without AWS: three fake gateways -> Concord (ingestion + state engine, in memory).
#   docker compose up --build
#   scripts/run-scenario.sh gateway-simulator/scenarios/chaos-1000.json http://localhost:8081
#   curl localhost:8080/local/stats       # ingestion
#   curl localhost:8080/local/engine      # state engine
#   curl localhost:8080/local/payments/a/<paymentId>
x-simulator: &simulator
  build:
    context: .
    dockerfile: gateway-simulator/Dockerfile
  image: concord/gateway-simulator:dev
  restart: unless-stopped
  depends_on: [ingestion]

services:
  ingestion:
    build:
      context: .
      dockerfile: state-engine/Dockerfile
    image: concord/state-engine:dev
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      CONCORD_BACKEND: memory
      GATEWAY_A_SECRETS: whsec_dev_gateway_a
      GATEWAY_B_SECRETS: whsec_dev_gateway_b
      GATEWAY_C_SECRETS: whsec_dev_gateway_c

  gateway-a:
    <<: *simulator
    ports: ["8081:8081"]
    environment:
      PORT: 8081
      SIM_GATEWAY: A
      SIM_WEBHOOK_SECRET: whsec_dev_gateway_a
      SIM_API_KEY: key_dev_gateway_a
      SIM_TARGET_URL: http://ingestion:8080/webhooks/a

  gateway-b:
    <<: *simulator
    ports: ["8082:8082"]
    environment:
      PORT: 8082
      SIM_GATEWAY: B
      SIM_WEBHOOK_SECRET: whsec_dev_gateway_b
      SIM_API_KEY: key_dev_gateway_b
      SIM_TARGET_URL: http://ingestion:8080/webhooks/b

  gateway-c:
    <<: *simulator
    ports: ["8083:8083"]
    environment:
      PORT: 8083
      SIM_GATEWAY: C
      SIM_WEBHOOK_SECRET: whsec_dev_gateway_c
      SIM_API_KEY: key_dev_gateway_c
      SIM_TARGET_URL: http://ingestion:8080/webhooks/c
